<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Mohamed Hasan — Full-Stack Developer">
  <defs>
    <linearGradient id="og-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="og-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#ff0505"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.18"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0f1a"/>
  <rect width="1200" height="630" fill="url(#og-grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- logo tile -->
  <g transform="translate(96,250)">
    <rect width="130" height="130" rx="30" fill="url(#og-grad)"/>
    <text x="65" y="58" font-family="'JetBrains Mono',monospace" font-size="52" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central" letter-spacing="-1">MH</text>
    <path d="M48 86 L60 96 L48 106" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="64" y="93" width="20" height="6" rx="3" fill="#fff"/>
  </g>

  <text x="262" y="300" font-family="'Plus Jakarta Sans',sans-serif" font-size="78" font-weight="800" fill="url(#og-text)" letter-spacing="-2">Mohamed Hasan</text>
  <text x="266" y="356" font-family="'Plus Jakarta Sans',sans-serif" font-size="32" font-weight="600" fill="#f1f5f9">Full-Stack Developer &amp; CS Student</text>
  <text x="266" y="404" font-family="'JetBrains Mono',monospace" font-size="22" fill="#94a3b8">offline-first PWAs · Supabase · PostgreSQL RLS · vanilla JS</text>

  <g font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700">
    <text x="96" y="470" fill="#06b6d4">UniManager</text>
    <text x="300" y="470" fill="#2ecc71">رُقِيّ · Ruqi</text>
    <text x="96" y="510" fill="#64748b">andrewleko19-boop.github.io/portfolio</text>
  </g>
</svg>
